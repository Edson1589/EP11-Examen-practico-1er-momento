name: rrhh-marcaciones

services:
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - red_rrhh

  api:
    build: ./api
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Configura DB_NAME en .env}
      DB_USER: ${DB_USER:?Configura DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - red_rrhh

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Configura DB_NAME en .env}
      POSTGRES_USER: ${DB_USER:?Configura DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - red_rrhh

volumes:
  datos_postgres:

networks:
  red_rrhh:
    driver: bridge

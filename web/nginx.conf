server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    location /api/ {
        set $servidor_api api:3000;
        proxy_pass http://$servidor_api$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /api-no-disponible;
    }

    location = /api-no-disponible {
        internal;
        default_type application/json;
        charset utf-8;
        return 503 '{"error":"La API no está disponible. Intenta nuevamente en unos momentos."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
